name: Validate desktop app

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install frontend dependencies
        run: npm install
      - name: Build frontend
        run: npm run build

  rust-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Tauri Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Tauri CLI dependencies
        working-directory: apps/desktop
        run: npm install
      - name: Generate required Tauri icon set
        working-directory: apps/desktop
        shell: bash
        run: |
          python3 - <<'PY'
          import struct
          import zlib
          from pathlib import Path

          width = height = 128
          rows = []
          for y in range(height):
              row = bytearray([0])
              for x in range(width):
                  inside_n = (
                      (20 <= x < 36 and 24 <= y < 104)
                      or (92 <= x < 108 and 24 <= y < 104)
                      or (36 <= x < 93 and 24 <= y < 104 and abs((x - 36) - (y - 24) * 56 / 80) < 8)
                  )
                  row.extend((245, 248, 255, 255) if inside_n else (15, 28, 52, 255))
              rows.append(bytes(row))

          def chunk(kind, data):
              return struct.pack("!I", len(data)) + kind + data + struct.pack("!I", zlib.crc32(kind + data) & 0xFFFFFFFF)

          png = bytes([137, 80, 78, 71, 13, 10, 26, 10])
          png += chunk(b"IHDR", struct.pack("!2I5B", width, height, 8, 6, 0, 0, 0))
          png += chunk(b"IDAT", zlib.compress(b"".join(rows), 9))
          png += chunk(b"IEND", b"")
          Path("/tmp/nexus-control-icon.png").write_bytes(png)
          PY
          npx tauri icon /tmp/nexus-control-icon.png --output src-tauri/icons
      - name: Check Rust application
        working-directory: apps/desktop/src-tauri
        run: cargo check

  relay-smoke:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/remote-relay
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install relay dependencies
        run: npm install
      - name: Test desktop-to-Windows pairing and command relay
        run: npm test
