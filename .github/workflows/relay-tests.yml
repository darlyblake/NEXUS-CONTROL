name: Validate remote relay

on:
  push:
    branches: [main]
    paths:
      - "services/remote-relay/**"
      - ".github/workflows/relay-tests.yml"
  pull_request:
    branches: [main]
    paths:
      - "services/remote-relay/**"
      - ".github/workflows/relay-tests.yml"
  workflow_dispatch:

jobs:
  relay-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/remote-relay
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Run relay integration tests
        run: npm test
