name: Publish Linux .deb update

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nexus-control-linux-release
  cancel-in-progress: false

jobs:
  release-linux:
    name: Build and publish Linux .deb
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set release version
        id: version
        shell: bash
        run: |
          VERSION="0.1.${GITHUB_RUN_NUMBER}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          sed -i -E "s/^version = \"[0-9]+\.[0-9]+\.[0-9]+\"/version = \"$VERSION\"/" src-tauri/Cargo.toml
          sed -i -E "s/\"version\": \"[0-9]+\.[0-9]+\.[0-9]+\"/\"version\": \"$VERSION\"/" src-tauri/tauri.conf.json
          echo "Building NEXUS CONTROL $VERSION"

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential curl wget file pkg-config \
            libwebkit2gtk-4.1-dev libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm install

      - name: Build Debian package
        run: npm run tauri:build -- --bundles deb

      - name: Prepare stable release asset and checksum
        shell: bash
        run: |
          DEB_PATH="$(find src-tauri/target/release/bundle/deb -maxdepth 1 -type f -name '*.deb' -print -quit)"
          if [ -z "$DEB_PATH" ]; then
            echo "No .deb package was produced by Tauri." >&2
            exit 1
          fi
          cp "$DEB_PATH" nexus-control-linux.deb
          sha256sum nexus-control-linux.deb > SHA256SUMS
          cat SHA256SUMS

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: NEXUS CONTROL ${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: |
            apps/desktop/nexus-control-linux.deb
            apps/desktop/SHA256SUMS
