name: Build desktop installers

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Build on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            artifact_name: nexus-control-linux
          - os: windows-latest
            artifact_name: nexus-control-windows
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential curl wget file pkg-config \
            libwebkit2gtk-4.1-dev libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm install

      - name: Generate valid Tauri icon set
        shell: bash
        run: |
          python3 - <<'PY'
          import struct
          import zlib
          from pathlib import Path

          width = height = 512
          rows = []
          for y in range(height):
              row = bytearray([0])
              for x in range(width):
                  # Dark navy background and a simple white N.
                  inside_n = (
                      (80 <= x < 144 and 96 <= y < 416)
                      or (368 <= x < 432 and 96 <= y < 416)
                      or (
                          36 <= x < 93
                          and 24 <= y < 104
                          and abs((x - 36) - (y - 24) * 56 / 80) < 8
                      )
                  )
                  row.extend((245, 248, 255, 255) if inside_n else (15, 28, 52, 255))
              rows.append(bytes(row))

          def chunk(kind, data):
              return (
                  struct.pack("!I", len(data))
                  + kind
                  + data
                  + struct.pack("!I", zlib.crc32(kind + data) & 0xFFFFFFFF)
              )

          # Build the PNG signature as byte values to avoid accidental escaping
          # that would produce a file containing the literal characters "\\x89PNG".
          png = bytes([137, 80, 78, 71, 13, 10, 26, 10])
          png += chunk(b"IHDR", struct.pack("!2I5B", width, height, 8, 6, 0, 0, 0))
          png += chunk(b"IDAT", zlib.compress(b"".join(rows), 9))
          png += chunk(b"IEND", b"")
          Path("nexus-control-icon.png").write_bytes(png)
          PY
          npx tauri icon nexus-control-icon.png --output src-tauri/icons

      - name: Build native desktop application
        run: npm run tauri:build

      - name: Upload Windows installer artifacts
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
          retention-days: 14

      - name: Upload Linux package artifacts
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            apps/desktop/src-tauri/target/release/bundle/deb/*.deb
            apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage
            apps/desktop/src-tauri/target/release/bundle/rpm/*.rpm
          if-no-files-found: error
          retention-days: 14

      - name: Setup .NET for NEXUS Agent
        if: runner.os == 'Windows'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Publish Windows background agent
        if: runner.os == 'Windows'
        run: dotnet publish ../windows/NexusAgent/NexusAgent.csproj --configuration Release --runtime win-x64 --self-contained true --output artifacts/windows-agent

      - name: Package installer scripts and instructions
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Copy-Item ../windows/installer/*.ps1 artifacts/windows-agent/
          Copy-Item ../windows/README.md artifacts/windows-agent/README-agent.md

      - name: Upload Windows agent artifact
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: nexus-agent-windows-x64
          path: apps/desktop/artifacts/windows-agent/**
          if-no-files-found: error
          retention-days: 14
