name: Windows Agent

on:
  push:
    branches: [main]
    paths:
      - "apps/windows/**"
      - "apps/desktop/src/**"
      - "services/remote-relay/**"
      - ".github/workflows/windows-agent.yml"
  pull_request:
    paths:
      - "apps/windows/**"
      - "apps/desktop/src/**"
      - "services/remote-relay/**"
      - ".github/workflows/windows-agent.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-shared-protocol:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate relay syntax
        run: node --check services/remote-relay/server.mjs

      - name: Build NEXUS CONTROL desktop frontend
        working-directory: apps/desktop
        run: |
          npm install
          npm run build

  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Validate PowerShell installer syntax
        shell: pwsh
        run: |
          $files = @('apps/windows/installer/Install-NexusAgent.ps1', 'apps/windows/installer/Uninstall-NexusAgent.ps1')
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file), [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | Format-List
              throw "PowerShell syntax errors in $file"
            }
          }

      - name: Restore
        run: dotnet restore apps/windows/NexusAgent/NexusAgent.csproj

      - name: Build
        run: dotnet build apps/windows/NexusAgent/NexusAgent.csproj --configuration Release --no-restore

      - name: Publish self-contained Windows x64 agent
        run: dotnet publish apps/windows/NexusAgent/NexusAgent.csproj --configuration Release --runtime win-x64 --self-contained true --output artifacts/windows-agent

      - name: Package installer scripts and instructions
        shell: pwsh
        run: |
          Copy-Item apps/windows/installer/*.ps1 artifacts/windows-agent/
          Copy-Item apps/windows/README.md artifacts/windows-agent/README-agent.md

      - name: Upload Windows agent
        uses: actions/upload-artifact@v4
        with:
          name: nexus-agent-windows-x64
          path: artifacts/windows-agent/**
          if-no-files-found: error
          retention-days: 14
