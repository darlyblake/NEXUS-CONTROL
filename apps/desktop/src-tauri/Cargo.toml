[package]
name = "nexus-control-desktop"
version = "0.1.0"
description = "NEXUS CONTROL desktop application"
authors = ["NEXUS CONTROL contributors"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
tungstenite = { version = "0.26", default-features = false, features = ["handshake"] }
tiny_http = "0.12"
uuid = { version = "1", features = ["v4"] }
